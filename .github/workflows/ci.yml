name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python sources
        run: python -m compileall -q src/main/python

  lint:
    name: Flake8 (errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - name: Run flake8
        run: |
          flake8 src/main/python \
            --select=E9,F63,F7,F82 \
            --exclude=examples,quickSelectLists,backend/plotting/chord_diagram.py

  tests:
    name: Unit tests + full import smoke test
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn statsmodels pingouin \
            fastcluster hdbscan umap-learn seaborn matplotlib openpyxl \
            XlsxWriter threadpoolctl pynndescent numba joblib tqdm requests \
            littleutils outdated pandas-flavor PyQt6 darkdetect wordcloud \
            lmfit pycryptodomex pytest
      - name: Run test suite
        run: |
          cd src/main/python
          pytest tests/ -v
